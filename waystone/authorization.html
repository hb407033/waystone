<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Waystone · 设备授权</title>
<style>body{margin:0;background:#f4f5f1;color:#24352e;font:16px system-ui}main{max-width:440px;margin:8vh auto;padding:32px;background:white;border:1px solid #dde3dc;border-radius:14px}h1{font-size:26px;margin:8px 0 18px}p{line-height:1.7;color:#526359}label{display:block;margin:16px 0 6px}input,button{box-sizing:border-box;width:100%;padding:12px;font:inherit;border:1px solid #becbc2;border-radius:6px}button{margin-top:22px;background:#245b46;color:white;cursor:pointer}button:disabled{opacity:.5}small{display:block;line-height:1.6;margin-top:18px}#status{white-space:pre-wrap}a{color:#245b46}@media(max-width:520px){main{margin:20px 12px;padding:24px}}</style>
<main><small>WAYSTONE</small><h1 id="title">授权你的 Agent 设备</h1><p id="intro">只批准你刚刚发起的设备请求。密码仅用于登录，不会交给 Agent。</p>
<form id="form"><label id="codeLabel" for="code">设备授权码</label><input id="code" required autocomplete="off"><button id="inspect" type="button">核对请求设备</button><p id="device"></p><div id="nameWrap" hidden><label for="name">姓名</label><input id="name" autocomplete="name"></div><label for="email">邮箱</label><input id="email" type="email" required autocomplete="username"><label for="password">密码</label><input id="password" type="password" required autocomplete="current-password"><button id="submit">登录并授权</button></form><p id="status" role="status" aria-live="polite"></p><small id="foot">授权有效期 10 分钟。授权成功后返回 Agent，即可继续项目操作。</small></main>
<script>
const invite=location.pathname==='/invite';let checked='';const $=id=>document.getElementById(id);
if(invite){$('title').textContent='加入 Waystone 项目';$('intro').textContent='使用收到邀请的邮箱注册。已有账号请直接填写原密码。';$('codeLabel').textContent='邀请代码';$('code').type='password';$('code').value=decodeURIComponent(location.hash.slice(1));history.replaceState(null,'',location.pathname);$('nameWrap').hidden=false;$('inspect').hidden=true;$('submit').textContent='接受邀请';$('foot').textContent='完成加入后，返回 Agent 发起设备登录授权。'}else{$('code').value=new URLSearchParams(location.search).get('code')||'';history.replaceState(null,'',location.pathname)}
async function post(path,data,token){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:JSON.stringify(data),cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:'输入有误，请检查');return d}
$('inspect').onclick=async()=>{try{const code=$('code').value;const d=await post('/device/inspect',{user_code:code});$('device').textContent='请求设备：'+d.label+'。请与终端显示核对。';checked=code}catch(e){$('status').textContent=e.message;checked=''}};
$('form').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;let token;try{const email=$('email').value,password=$('password').value;if(invite){let d;try{d=await post('/auth/login',{email,password});token=d.token;d=await post('/invites/accept',{invite:$('code').value},token);await post('/auth/logout',{},token);token=d.token}catch(err){if(token)throw err;d=await post('/auth/join',{email,password,name:$('name').value||email,invite:$('code').value})}token=token||d.token;$('status').textContent='已加入项目。请返回 Agent，运行设备登录并绑定项目。'}else{if(checked!==$('code').value)throw Error('请先核对请求设备');const d=await post('/auth/login',{email,password});token=d.token;await post('/device/approve',{user_code:$('code').value},token);$('status').textContent='设备授权成功。可以关闭页面，返回 Agent。'}$('password').value='';$('form').hidden=true}catch(e){$('status').textContent=e.message}finally{if(token)try{await post('/auth/logout',{},token)}catch{}$('submit').disabled=false}};
</script></html>
