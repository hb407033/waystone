<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>项目记忆 · 连接授权</title>
<style>body{margin:0;background:#f4f5f1;color:#24352e;font:16px system-ui}main{max-width:460px;margin:8vh auto;padding:32px;background:white;border:1px solid #dde3dc;border-radius:14px}h1{font-size:26px;margin:8px 0 18px}p{line-height:1.7;color:#526359}dl{margin:0 0 12px}dt{font-size:13px;color:#7a8a80;margin-top:12px}dd{margin:2px 0 0;word-break:break-all;color:#24352e;font-weight:600}label{display:block;margin:16px 0 6px}input,button{box-sizing:border-box;width:100%;padding:12px;font:inherit;border:1px solid #becbc2;border-radius:6px}button{margin-top:22px;background:#245b46;color:white;cursor:pointer}button:disabled{opacity:.5}.warn{background:#fff6e5;border:1px solid #f0d9a8;border-radius:8px;padding:10px 12px;color:#6b4e16}.row{display:flex;gap:12px}#deny{background:white;color:#245b46}small{display:block;line-height:1.6;margin-top:18px}#status{white-space:pre-wrap}@media(max-width:520px){main{margin:20px 12px;padding:24px}}</style>
<main><small>PROJECT MEMORY</small><h1>授权应用连接项目记忆</h1>
<dl><dt>应用自报名称（未经验证）</dt><dd id="client">正在读取…</dd><dt>客户端编号末 8 位</dt><dd id="cid"></dd><dt>授权后跳转到</dt><dd id="redirect"></dd><dt>权限范围</dt><dd id="scope"></dd></dl>
<p class="warn">应用名称由对方自行填写，不能作为信任依据。只在你本人刚刚在 Claude、Codex 等应用里点了“连接”时批准，别人发来的授权链接一律拒绝。批准后，该应用可以用你的身份读写你所在项目的记忆，授权最长 30 天，可以随时断开。</p>
<form id="form" hidden><label for="email">邮箱</label><input id="email" type="email" required autocomplete="username"><label for="password">密码</label><input id="password" type="password" required autocomplete="current-password"><div class="row"><button id="deny" type="button">拒绝</button><button id="approve">登录并批准</button></div></form>
<p id="status" role="status" aria-live="polite"></p></main>
<script>
const $=id=>document.getElementById(id);const request=location.hash.slice(1);history.replaceState(null,'',location.pathname);
async function post(path,data){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data),cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:'授权请求无效，请回到应用重新发起连接');return d}
(async()=>{try{const d=await post('/oauth/consent/inspect',{request});$('client').textContent=d.client_name;$('cid').textContent=d.client_id_tail;$('redirect').textContent=d.redirect_uri+(d.loopback?'（本机应用，如 Claude Code、Codex）':'');$('scope').textContent=d.scopes.join(' ')+'：读写你所在项目的记忆';$('form').hidden=false}catch(e){$('client').textContent='无法读取';$('status').textContent=e.message}})();
$('form').onsubmit=async e=>{e.preventDefault();$('approve').disabled=true;try{const d=await post('/oauth/consent/approve',{request,email:$('email').value,password:$('password').value});$('password').value='';$('form').hidden=true;$('status').textContent='已批准，正在返回应用…';location.href=d.redirect}catch(err){$('status').textContent=err.message}finally{$('approve').disabled=false}};
$('deny').onclick=async()=>{try{const d=await post('/oauth/consent/deny',{request});$('form').hidden=true;$('status').textContent='已拒绝。';location.href=d.redirect}catch(err){$('status').textContent=err.message}};
</script></html>
