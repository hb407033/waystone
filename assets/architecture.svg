<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Waystone 系统架构图</title>
  <desc id="desc">成员电脑通过 MCP 或命令行，经 Caddy 反向代理访问 Waystone 服务；SQLite 保存权威数据，Mem0 只负责可重建的向量检索；底部展示一次召回的四步复核流程。</desc>
  <defs>
    <style>
      text { font-family: 'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',sans-serif; fill: #334155; }
      .zone { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 1.5; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; }
      .teal-card { fill: #F0FDFA; stroke: #14B8A6; stroke-width: 1.8; }
      .title { font-size: 21px; font-weight: 700; }
      .section { font-size: 16px; font-weight: 700; }
      .body { font-size: 13px; }
      .small { font-size: 12px; }
      .flow { fill: none; stroke: #0F766E; stroke-width: 2.2; }
      .data-flow { fill: none; stroke: #64748B; stroke-width: 2; }
    </style>
  </defs>

  <rect x="8" y="8" width="1184" height="664" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <g aria-label="标题">
    <path d="M32 43h16v22H32zM36 33h16v22H36z" fill="#64748B" stroke="#CBD5E1" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M39 45h7v8h7" fill="none" stroke="#14B8A6" stroke-width="3" stroke-linecap="round"/>
    <circle cx="39" cy="45" r="2.8" fill="#F59E0B"/>
    <text x="64" y="54" class="title">Waystone 共享项目记忆架构</text>
    <text x="1160" y="52" class="small" text-anchor="end" style="fill:#64748B">先确认再共享 · 来源可追溯 · 跨机器续接</text>
  </g>

  <g aria-label="成员电脑">
    <rect x="32" y="82" width="282" height="346" rx="18" class="zone"/>
    <text x="52" y="111" class="section">成员电脑（可多台）</text>
    <rect x="52" y="128" width="242" height="86" rx="12" class="card"/>
    <text x="173" y="157" class="section" text-anchor="middle">Claude Code / Codex / Pi</text>
    <rect x="87" y="172" width="172" height="28" rx="14" fill="#CCFBF1" stroke="#14B8A6"/>
    <text x="173" y="191" class="body" text-anchor="middle" font-weight="700" style="fill:#0F766E">+ Waystone Skill</text>

    <path d="M134 214v28" class="flow" fill="none" stroke="#0F766E" stroke-width="2.2"/>
    <rect x="133" y="214" width="2" height="28" fill="#0F766E"/>
    <path d="M128 241l6 9 6-9z" fill="#0F766E"/>
    <text x="145" y="236" class="small" style="fill:#0F766E">stdio MCP</text>
    <rect x="52" y="258" width="164" height="60" rx="12" class="teal-card"/>
    <text x="134" y="286" class="section" text-anchor="middle">waystone-mcp</text>
    <text x="134" y="305" class="small" text-anchor="middle">Agent 工具调用</text>

    <path d="M218 214v118" class="data-flow" fill="none" stroke="#64748B" stroke-width="2"/>
    <rect x="217" y="214" width="2" height="118" fill="#64748B"/>
    <path d="M212 331l6 9 6-9z" fill="#64748B"/>
    <text x="226" y="238" class="small" style="fill:#64748B">直接使用</text>
    <rect x="130" y="348" width="164" height="60" rx="12" class="card"/>
    <text x="212" y="376" class="section" text-anchor="middle">waystone CLI</text>
    <text x="212" y="395" class="small" text-anchor="middle">登录 / 管理 / 查询</text>
  </g>

  <g aria-label="访问与服务">
    <path d="M216 288h122q18 0 18-18v-51h39" class="flow" fill="none" stroke="#0F766E" stroke-width="2.2"/>
    <path d="M216 287h140v-69h21v3h-18v50c0 11-9 19-20 19H216z" fill="#0F766E"/>
    <path d="M377 213l9 6-9 6z" fill="#0F766E"/>
    <path d="M294 378h44q18 0 18-18V243h21" class="flow" fill="none" stroke="#0F766E" stroke-width="2.2"/>
    <path d="M294 377h61V242h22v3h-19v115c0 11-9 20-20 20h-44z" fill="#0F766E"/>
    <path d="M377 237l9 6-9 6z" fill="#0F766E"/>
    <rect x="322" y="170" width="70" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="357" y="187" class="small" text-anchor="middle" font-weight="700" style="fill:#0F766E">HTTPS</text>

    <rect x="388" y="142" width="184" height="142" rx="16" class="teal-card"/>
    <rect x="406" y="160" width="46" height="46" rx="12" fill="#0F766E"/>
    <path d="M418 176h22M418 184h16M418 192h20" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <text x="466" y="181" class="section">反向代理</text>
    <text x="466" y="203" class="title" style="fill:#0F766E">Caddy</text>
    <line x1="406" y1="220" x2="554" y2="220" stroke="#99F6E4"/>
    <text x="480" y="242" class="body" text-anchor="middle">写入真实来源 IP</text>
    <text x="480" y="262" class="small" text-anchor="middle" style="fill:#64748B">用于登录限流</text>

    <path d="M572 213h33" class="flow" fill="none" stroke="#0F766E" stroke-width="2.2"/>
    <rect x="572" y="212" width="33" height="2" fill="#0F766E"/>
    <path d="M605 207l9 6-9 6z" fill="#0F766E"/>
    <text x="593" y="201" class="small" text-anchor="middle" style="fill:#0F766E">转发</text>

    <rect x="616" y="82" width="296" height="346" rx="18" class="zone"/>
    <rect x="636" y="102" width="256" height="68" rx="14" fill="#334155"/>
    <text x="764" y="130" class="title" text-anchor="middle" style="fill:#FFFFFF">Waystone 服务</text>
    <text x="764" y="153" class="body" text-anchor="middle" style="fill:#CBD5E1">FastAPI</text>
    <text x="640" y="196" class="body" font-weight="700" style="fill:#64748B">服务端权限、状态与来源校验</text>

    <rect x="636" y="212" width="116" height="42" rx="10" class="card"/>
    <circle cx="652" cy="233" r="4" fill="#14B8A6"/>
    <text x="664" y="238" class="body">成员与角色</text>
    <rect x="764" y="212" width="128" height="42" rx="10" class="card"/>
    <circle cx="780" cy="233" r="4" fill="#F59E0B"/>
    <text x="792" y="238" class="body">提案审核</text>

    <rect x="636" y="264" width="256" height="62" rx="10" class="card"/>
    <circle cx="652" cy="285" r="4" fill="#14B8A6"/>
    <text x="664" y="290" class="body">适用范围</text>
    <text x="664" y="312" class="small" style="fill:#64748B">环境 / 分支 / 来源版本</text>

    <rect x="636" y="336" width="116" height="42" rx="10" class="card"/>
    <circle cx="652" cy="357" r="4" fill="#14B8A6"/>
    <text x="664" y="362" class="body">交接过期</text>
    <rect x="764" y="336" width="60" height="42" rx="10" class="card"/>
    <text x="794" y="362" class="body" text-anchor="middle">撤回</text>
    <rect x="832" y="336" width="60" height="42" rx="10" class="card"/>
    <text x="862" y="362" class="body" text-anchor="middle">审计</text>
    <rect x="636" y="390" width="256" height="22" rx="11" fill="#CCFBF1"/>
    <text x="764" y="405" class="small" text-anchor="middle" style="fill:#0F766E">唯一决策入口：SQL 复核后返回</text>
  </g>

  <g aria-label="存储">
    <text x="940" y="111" class="section">数据存储</text>
    <path d="M912 190h15" class="data-flow" fill="none" stroke="#64748B" stroke-width="2"/>
    <rect x="912" y="189" width="15" height="2" fill="#64748B"/>
    <path d="M927 184l9 6-9 6z" fill="#64748B"/>
    <text x="924" y="178" class="small" text-anchor="middle" style="fill:#64748B">读写</text>
    <rect x="938" y="126" width="230" height="142" rx="16" class="card"/>
    <ellipse cx="974" cy="158" rx="18" ry="7" fill="#64748B"/>
    <path d="M956 158v29c0 4 8 7 18 7s18-3 18-7v-29M956 173c0 4 8 7 18 7s18-3 18-7" fill="#CBD5E1" stroke="#64748B" stroke-width="2"/>
    <text x="1006" y="166" class="title">SQLite</text>
    <rect x="958" y="208" width="190" height="38" rx="9" fill="#F1F5F9"/>
    <text x="1053" y="224" class="small" text-anchor="middle" font-weight="700">权威数据</text>
    <text x="1053" y="240" class="small" text-anchor="middle">成员、记忆、提案、审计</text>

    <path d="M912 337h15" class="data-flow" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="5 5"/>
    <rect x="912" y="336" width="5" height="2" fill="#64748B"/>
    <rect x="921" y="336" width="6" height="2" fill="#64748B"/>
    <path d="M927 331l9 6-9 6z" fill="#64748B"/>
    <text x="924" y="325" class="small" text-anchor="middle" style="fill:#64748B">检索</text>
    <rect x="938" y="286" width="230" height="142" rx="16" class="teal-card"/>
    <circle cx="974" cy="324" r="22" fill="#0F766E"/>
    <circle cx="968" cy="319" r="4" fill="#FFFFFF"/>
    <circle cx="981" cy="314" r="4" fill="#99F6E4"/>
    <circle cx="982" cy="331" r="4" fill="#F59E0B"/>
    <path d="M971 318l7-3M971 322l8 7M981 318v9" stroke="#FFFFFF" stroke-width="2"/>
    <text x="1006" y="320" class="section">自托管 Mem0</text>
    <text x="1006" y="341" class="small" style="fill:#0F766E">infer=false</text>
    <rect x="958" y="362" width="190" height="44" rx="9" fill="#FFFFFF" stroke="#99F6E4"/>
    <text x="1053" y="380" class="small" text-anchor="middle" font-weight="700">仅向量检索</text>
    <text x="1053" y="397" class="small" text-anchor="middle">可从 SQLite 全量重建</text>
  </g>

  <g aria-label="一次召回流程">
    <line x1="32" y1="458" x2="1168" y2="458" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="32" y="476" width="112" height="28" rx="14" fill="#334155"/>
    <text x="88" y="495" class="body" text-anchor="middle" font-weight="700" style="fill:#FFFFFF">一次召回</text>
    <text x="158" y="495" class="small" style="fill:#64748B">权限先行，向量只负责排序，最终仍由 SQL 复核</text>

    <rect x="32" y="520" width="254" height="112" rx="14" class="card"/>
    <circle cx="60" cy="548" r="17" fill="#0F766E"/>
    <text x="60" y="554" class="section" text-anchor="middle" style="fill:#FFFFFF">1</text>
    <text x="86" y="551" class="section">SQL 筛候选</text>
    <text x="52" y="581" class="body">按成员权限与适用范围筛选</text>
    <text x="52" y="605" class="small" style="fill:#64748B">项目 · 环境 · 分支 · 来源版本</text>

    <path d="M286 576h11" class="flow" fill="none" stroke="#0F766E" stroke-width="2.2"/>
    <rect x="286" y="575" width="11" height="2" fill="#0F766E"/>
    <path d="M297 570l9 6-9 6z" fill="#0F766E"/>
    <rect x="308" y="520" width="254" height="112" rx="14" class="teal-card"/>
    <circle cx="336" cy="548" r="17" fill="#0F766E"/>
    <text x="336" y="554" class="section" text-anchor="middle" style="fill:#FFFFFF">2</text>
    <text x="362" y="551" class="section">候选内向量检索</text>
    <text x="328" y="581" class="body">只在已筛候选记录中做排序</text>
    <text x="328" y="605" class="small" style="fill:#64748B">Mem0 不决定权限与有效性</text>

    <path d="M562 576h11" class="flow" fill="none" stroke="#0F766E" stroke-width="2.2"/>
    <rect x="562" y="575" width="11" height="2" fill="#0F766E"/>
    <path d="M573 570l9 6-9 6z" fill="#0F766E"/>
    <rect x="584" y="520" width="274" height="112" rx="14" class="card"/>
    <circle cx="612" cy="548" r="17" fill="#0F766E"/>
    <text x="612" y="554" class="section" text-anchor="middle" style="fill:#FFFFFF">3</text>
    <text x="638" y="551" class="section">结果回 SQL 复核</text>
    <text x="604" y="581" class="body">复核项目归属、状态与有效期</text>
    <text x="604" y="605" class="small" style="fill:#64748B">阻断跨项目、撤回及过期内容</text>

    <path d="M858 576h11" class="flow" fill="none" stroke="#0F766E" stroke-width="2.2"/>
    <rect x="858" y="575" width="11" height="2" fill="#0F766E"/>
    <path d="M869 570l9 6-9 6z" fill="#0F766E"/>
    <rect x="880" y="520" width="288" height="112" rx="14" class="card"/>
    <circle cx="908" cy="548" r="17" fill="#F59E0B"/>
    <text x="908" y="554" class="section" text-anchor="middle" style="fill:#FFFFFF">4</text>
    <text x="934" y="551" class="section">返回结果</text>
    <text x="900" y="581" class="body">带来源的有效记忆返回 Agent</text>
    <text x="900" y="605" class="small" style="fill:#64748B">并附待处理的冲突提案</text>
  </g>
</svg>
